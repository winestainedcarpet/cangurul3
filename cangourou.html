<!DOCTYPE html>
<html>
<head>
   <title>index</title>
   <meta charset="utf-8">
   <style>
      *{
         box-sizing: border-box;
         margin: 0;
         padding: 0;
      }
      html,body {
         margin: 0;
         height: 100%;
      }
      body {
         height: 100%;
         background: white;
         color: black;
         padding: 3px;
         display: grid;
         grid-template-columns: max-content auto;
         grid-template-rows: max-content auto;
      }
      body>*{
         padding: 3px;
      }
      #header{
         grid-column: span 2;
         border-bottom: 1px solid black;
      }
      #panel{
         border-right: 1px solid black;
      }
      #cod{
         width: 100%;
         height: 100%;
      }
   </style>
</head>

<body>
   <header id="header">
      <h1>Cangurul 3(D)</h1>
   </header>
   <aside id="panel">
      <textarea id="cod">[

]</textarea>
   </aside>
   <main id="cangur">
      <canvas id="grid"></canvas>
   </main>
</body>
<script src="script.js"></script>

</html>
