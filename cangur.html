<!DOCTYPE html>
<html>
<head>
   <title>cangur</title>
   <meta charset="utf-8">
   <link rel="stylesheet" type="text/css" href="cangur.css">
</head>

<body>
   <header id="header">
      <h1>Cangurul 3</h1>
      <label>
         Tip grid:
         <select id="grid-type" value="square">
            <option value="square">pătrat</option>
            <option value="disc">disc</option>
         </select>
      </label>
      <label id="columns_input_label">
         coloane: <input type="number" id="columns_input" value="9" min="2" max="100">
      </label>
      <label id="rows_input_label">
         rânduri: <input type="number" id="rows_input" value="9" min="2" max="100">
      </label>
      <label id="rings_input_label" style="display: none;">
         inele: <input type="number" id="rings_input" value="9" min="2" max="100">
      </label>
      <label id="segments_input_label" style="display: none;">
         segmente: <input type="number" id="segments_input" value="9" min="2" max="100">
      </label>
      <button id="reset_drawing_button">Reset desen</button>
   </header>
      <!-- <dialog open style="margin: auto;">
         PAS
Cangurul execută un „PAS”, adică lasă o urmă pe traiectoria pe care a mers.
SALT
Cangurul execută un „SALT”, adică execută un „PAS” fără a lăsa urme.
ROTIRE
Cangurul execută o „ROTIRE”, cu 90 de grade după acele ceasornicului.
      </dialog> -->
   <aside id="panel">
      <button>Tutorial / instrucțiuni</button>
      <div id="actions">
         <button>Rulare</button>
         <button disabled>Oprire</button>
         <button>Iterează</button>
         <label>
            Milisecunde intre fiecare iterație:
            <input type="number" id="iterations_speed" value="1000" min="100" max="1000">
         </label>
      </div>
      <hr>
      <div id="quickcode">
         <label style="width:100%;">
            control manual:
            <input type="checkbox" id="manual_mode">
         </label>
         <button id="step_button">PAS</button>
         <button id="jump_button">SALT</button>
         <button id="rotate_button">ROTIRE</button>
         <details style="padding: 0;">
            <summary>Comenzi avansate</summary>
            <section id="advanced_quickcode">
               <button>
                  REPETA
                  <input type="number" style="width: 3em;display: inline-block;">
                  ORI
               </button>
               <button>
                  PROCEDURA
                  <input type="text" style="width: 6em;display: inline-block;">
               </button>
               <button>
                  EXECUTA
                  <input type="text" style="width: 6em;display: inline-block;">
               </button>
               <button>
                  CIT
                  <select>
                     <option>E_MARGINE</option>
                     <option>NU E_MARGINE</option>
                     <option>E_LINIE</option>
                     <option>NU E_LINIE</option>
                  </select>
               </button>
               <button>
                  DACA
                  <select>
                     <option>E_MARGINE</option>
                     <option>NU E_MARGINE</option>
                     <option>E_LINIE</option>
                     <option>NU E_LINIE</option>
                  </select>
                  ATUNCI [...] ALTFEL [...]
               </button>
            </section>
         </details>
      </div>

<textarea id="cod">[

]</textarea>

   </aside>
   <main id="main">
      <div id="cangur_container">
         <div id="cangur"></div>
         <canvas id="grid"></canvas>
      </div>
   </main>
</body>
<script src="script.js"></script>
</html>
